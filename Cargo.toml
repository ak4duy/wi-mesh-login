[package]
name = "wi-mesh-login"
version = "0.1.0"
edition = "2024"
description = "A quick CLI for logging into Wi-MESH (VN) captive portal on Linux headless server"
license = "MIT"
repository = "https://github.com/akaduy/wi-mesh-login"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
if-addrs = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "rustls-tls"] }
scraper = "0.23"
url = "2.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
