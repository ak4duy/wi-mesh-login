[package]
name = "wi-mesh-login"
version = "0.3.4"
edition = "2024"
description = "A quick CLI for logging into Wi-MESH (VN) and claim rewards"
license = "MIT"
repository = "https://github.com/ak4duy/wi-mesh-login"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
if-addrs = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "multipart", "rustls-tls"] }
scraper = "0.23"
serde_json = "1.0"
md-5 = "0.10"
getrandom = "0.2"
url = "2.5"
rpassword = "7.4"
time = { version = "0.3", features = ["formatting"] }

# No keyring backend exists for Android; it uses a private file instead
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "windows-native"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
